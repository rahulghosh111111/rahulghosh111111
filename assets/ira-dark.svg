    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#161B22"/><stop offset="100%" stop-color="#1B1530"/></linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.8"><stop offset="0%" stop-color="#FFB86B"/><stop offset="45%" stop-color="#FF5E8A"/><stop offset="100%" stop-color="#6C5CE7"/></radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="998" height="368" rx="20"/></clipPath>
  </defs>
