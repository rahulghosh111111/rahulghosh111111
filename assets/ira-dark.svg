    <rect x="40" y="34" width="150" height="28" rx="14" fill="url(#g)"/>
    <text x="115" y="53" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF" letter-spacing="1">★ FLAGSHIP</text>
    <rect x="200" y="34" width="174" height="28" rx="14" fill="none" stroke="#30363D"/>
    <text x="287.0" y="53" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8B949E" letter-spacing="0.6">PRIVATE · INVITE-ONLY</text>
    <text x="40" y="114" font-size="42" font-weight="800" fill="url(#g)">Ira Assistant</text>
    <text x="40" y="146" font-size="17" fill="#8B949E">A local-first, voice-locked desktop assistant for Windows.</text>
    <circle cx="52" cy="181" r="4" fill="url(#g)"/><text x="66" y="186" font-size="15" fill="#E6EDF3">Offline wake word, barge-in and Whisper fine-tuned for Hindi &amp; Bengali</text><circle cx="52" cy="209" r="4" fill="url(#g)"/><text x="66" y="214" font-size="15" fill="#E6EDF3">Voiceprint lock, risk-rated actions, undo journal, encrypted audit log</text><circle cx="52" cy="237" r="4" fill="url(#g)"/><text x="66" y="242" font-size="15" fill="#E6EDF3">Reads and clicks anything on screen with OCR and a local vision model</text>
    <rect x="40" y="276" width="560" height="1" fill="#30363D"/>
    <text x="40" y="314" font-size="28" font-weight="800" fill="url(#g)">1,900+</text><text x="40" y="336" font-size="12.5" fill="#8B949E">automated tests</text><text x="190" y="314" font-size="28" font-weight="800" fill="url(#g)">3</text><text x="190" y="336" font-size="12.5" fill="#8B949E">languages · EN HI BN</text><text x="340" y="314" font-size="28" font-weight="800" fill="url(#g)">0</text><text x="340" y="336" font-size="12.5" fill="#8B949E">API keys</text><text x="490" y="314" font-size="28" font-weight="800" fill="url(#g)">100%</text><text x="490" y="336" font-size="12.5" fill="#8B949E">on-device AI</text>
  </g>
