<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="t">
  <title id="t">Ira Assistant: a local-first, voice-locked desktop assistant for Windows</title>
  <defs>
